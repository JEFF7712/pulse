name: Site Docker Publish
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/install.sh'
      - '.dockerignore'
      - '.github/workflows/site-docker-publish.yml'
permissions:
  contents: read
env:
  DOCKER_IMAGE: jeff7712/pulse-site
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'jeff7712' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=0.0.${{ github.run_number }}
      - name: Build and push site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./site/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
