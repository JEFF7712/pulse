name: Site Docker Publish
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/install.sh'
      - '.dockerignore'
      - '.github/workflows/site-docker-publish.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/install.sh'
      - '.dockerignore'
      - '.github/workflows/site-docker-publish.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Run site smoke test
        working-directory: site
        run: bash tests/static-site-smoke.sh
  publish:
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ format('{0}/pulse-site', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Build and push site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./site/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
