<!DOCTYPE html>
<!-- Full-bleed #050505 frame for headless screenshot (avoids Chrome letterboxing SVG on white). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>readme banner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 920px;
        height: 132px;
        background: #050505;
        overflow: hidden;
      }
      img {
        display: block;
        width: 920px;
        height: 132px;
        vertical-align: top;
      }
    </style>
  </head>
  <body>
    <img src="readme-pulse-hero.svg" width="920" height="132" alt="" />
  </body>
</html>
