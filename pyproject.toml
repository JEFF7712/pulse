[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Backend-first MVP for Pulse"
readme = "DESIGN.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7",
    "rich-argparse>=1.5",
    "fastapi",
    "pydantic",
    "aiosqlite",
    "apscheduler",
    "httpx",
    "feedparser>=6.0.11",
    "mcp[cli]",
    "google-auth-oauthlib",
    "google-api-python-client",
    "plaid-python>=24",
    "anthropic",
    "uvicorn[standard]",
]

[project.scripts]
pulse-mcp = "pulse.mcp.server:main"
pulse = "pulse.app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
