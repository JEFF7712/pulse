[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Backend-first MVP for Pulse"
readme = "DESIGN.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "aiosqlite",
    "apscheduler",
    "httpx",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
