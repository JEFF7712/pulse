[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-agent"
version = "2.0.3"
description = "Self-hosted personal intelligence agent"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["personal-intelligence", "data-ingestion", "self-hosted", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.7",
    "rich-argparse>=1.5",
    "fastapi",
    "pydantic",
    "aiosqlite",
    "apscheduler",
    "httpx",
    "feedparser>=6.0.11",
    "mcp[cli]",
    "google-auth-oauthlib",
    "google-api-python-client",
    "plaid-python>=24",
    "anthropic",
    "uvicorn[standard]",
    "questionary>=2.1.1",
]

[project.scripts]
pulse-mcp = "pulse.mcp.server:main"
pulse = "pulse.app.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.0"]
gemini = ["google-genai>=1.0"]
all-llm = ["openai>=1.0", "google-genai>=1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
